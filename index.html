<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Armoury — kit your didy before you go out</title>
<meta name="description" content="A fallworld room. Say where you are going and your didy kits itself from the estate. The bar that levels up is how much of the raid runs on your own electric instead of rented.">
<style>
:root{
  --ground:#0b0e12; --stone:#141a21; --stone-2:#0f151b; --edge:#2b3542; --edge-soft:#1d2530;
  --ink:#e4ebf2; --dim:#94a2b1; --faint:#5f6d7c;
  --gold:#e0b055; --gold-deep:#8a6a22;
  --mine:#59d9a4;      /* yours forever — deterministic, no model */
  --small:#5fa8e8;     /* a small model will do */
  --rent:#e0813f;      /* above your rig: rented, on somebody else's electric */
  --blood:#d9635e;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Cascadia Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="light"]{
  --ground:#e6e9ee; --stone:#fff; --stone-2:#eff2f6; --edge:#c3cdd8; --edge-soft:#dee5ec;
  --ink:#141b23; --dim:#54626f; --faint:#8593a1;
  --gold:#8a6410; --gold-deep:#d8c48c;
  --mine:#0c7a58; --small:#22598f; --rent:#a8551a; --blood:#a83c37;
}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
  --ground:#e6e9ee; --stone:#fff; --stone-2:#eff2f6; --edge:#c3cdd8; --edge-soft:#dee5ec;
  --ink:#141b23; --dim:#54626f; --faint:#8593a1;
  --gold:#8a6410; --gold-deep:#d8c48c;
  --mine:#0c7a58; --small:#22598f; --rent:#a8551a; --blood:#a83c37;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ── the character bar: the one thing that levels up ─────────────── */
#you{
  display:grid;grid-template-columns:auto 1fr auto;gap:8px 16px;align-items:center;
  padding:9px 16px;background:var(--stone);border-bottom:1px solid var(--edge);flex:0 0 auto;
}
.crest{display:flex;align-items:baseline;gap:10px;min-width:0}
.crest .nm{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.crest .nm b{color:var(--gold)}
.crest .rank{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--gold-deep);color:var(--gold);border-radius:2px;padding:2px 7px;white-space:nowrap;
}
.xp{min-width:0}
.xp .lab{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.xp .lab b{color:var(--mine);font-variant-numeric:tabular-nums}
.xp .lab b.part{color:var(--rent)}
.track{height:11px;background:var(--stone-2);border:1px solid var(--edge);border-radius:2px;overflow:hidden;display:flex}
.track i{display:block;height:100%;background:var(--mine);transition:width .35s ease}
.track u{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--rent),var(--rent) 4px,transparent 4px,transparent 8px);
  transition:width .35s ease}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tools button{background:none;border:1px solid var(--edge);color:var(--dim);border-radius:2px;
  padding:3px 9px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tools button:hover{border-color:var(--gold);color:var(--gold)}

/* ── the three panels ───────────────────────────────────────────── */
main{flex:1 1 auto;min-height:0;display:grid;gap:1px;background:var(--edge);
  grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,330px)}
.pane{background:var(--ground);min-width:0;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.pane>.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 13px;
  background:var(--stone);border-bottom:1px solid var(--edge-soft);position:sticky;top:0;z-index:2;flex:0 0 auto}
.pane>.hd em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.06em;text-align:right}
.pad{padding:13px;display:flex;flex-direction:column;gap:13px}

/* ── the rig: what you own, and what building the next one buys ─── */
.rung{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;padding:9px 10px;
  border:1px solid var(--edge-soft);border-radius:3px;background:var(--stone-2)}
.rung.now{border-color:var(--mine)}
.rung .pip{width:9px;height:9px;transform:rotate(45deg);background:var(--edge);margin-top:5px}
.rung.now .pip{background:var(--mine)}
.rung .t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.rung.now .t{color:var(--mine)}
.rung .s{font-size:12.5px;color:var(--dim);line-height:1.4}
#train{width:100%;background:var(--gold);color:var(--ground);border:none;border-radius:3px;padding:9px;
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;cursor:pointer}
#train:hover{filter:brightness(1.09)}
#train:disabled{background:var(--stone-2);color:var(--faint);border:1px solid var(--edge);cursor:default;filter:none}
.gain{font-size:12.5px;color:var(--dim);line-height:1.45}
.gain b{color:var(--mine)}

/* ── the kit ────────────────────────────────────────────────────── */
.slots{display:grid;gap:9px}
.item{
  position:relative;border:1px solid var(--edge);border-left-width:3px;border-radius:3px;
  background:var(--stone);padding:9px 11px;display:grid;gap:4px;cursor:help;
}
.item.mine{border-left-color:var(--mine)}
.item.small{border-left-color:var(--small)}
.item.rent{border-left-color:var(--rent)}
.item.void{border-style:dashed;border-left-width:1px;background:none;opacity:.5;cursor:default;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:13px 11px;text-align:center}
.item .r1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.item .nm{font-weight:650;font-size:14.5px}
.item.mine .nm{color:var(--mine)} .item.small .nm{color:var(--small)} .item.rent .nm{color:var(--rent)}
.item .tagline{margin-left:auto;display:flex;gap:5px;align-items:center;flex-shrink:0}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--edge);border-radius:99px;padding:1px 7px;color:var(--dim);white-space:nowrap}
.pill.rent{border-color:var(--rent);color:var(--rent)}
.pill.mine{border-color:var(--mine);color:var(--mine)}
.item .why{font-size:12.5px;color:var(--dim);line-height:1.45}
.sockets{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:2px}
.rune{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  border:1px solid var(--small);color:var(--small);border-radius:99px;padding:2px 8px 2px 5px}
.rune i{width:7px;height:7px;transform:rotate(45deg);background:var(--small);display:inline-block}
.hole{width:11px;height:11px;transform:rotate(45deg);border:1px dashed var(--edge)}
.vial{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--gold-deep);border-radius:3px;
  padding:5px 9px;font-size:12.5px;color:var(--dim)}
.vial b{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* ── the zone ───────────────────────────────────────────────────── */
#zoneform{display:flex;gap:8px}
#zone{flex:1 1 auto;background:var(--stone-2);border:1px solid var(--edge);border-radius:3px;padding:10px 12px;
  resize:none;min-height:44px;max-height:120px;font-size:14.5px}
#go{background:var(--gold);color:var(--ground);border:none;border-radius:3px;padding:0 17px;font-weight:700;
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#go:hover{filter:brightness(1.09)}
.quests{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:5px}
.quest{flex:0 0 auto;white-space:nowrap;background:var(--stone);border:1px solid var(--edge);color:var(--dim);
  border-radius:99px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.quest:hover{border-color:var(--gold);color:var(--ink)}
.reads{display:flex;flex-wrap:wrap;gap:6px}
.read{font-family:var(--mono);font-size:11px;border:1px solid var(--mine);color:var(--mine);
  border-radius:99px;padding:2px 9px}
.read span{color:var(--dim)}

/* ── the log ────────────────────────────────────────────────────── */
#log{display:flex;flex-direction:column;gap:11px;font-size:13.5px}
.line{border-left:2px solid var(--edge-soft);padding-left:11px}
.line.didy{border-left-color:var(--gold)}
.line.you{border-left-color:var(--mine)}
.line .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.line .txt{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--dim)}
.line .txt b{color:var(--ink);font-weight:650}
.line .txt em{font-style:italic;color:var(--faint)}

/* ── the shadow ─────────────────────────────────────────────────── */
.dead{display:grid;gap:7px}
.dead div{font-size:12.5px;color:var(--dim);padding-left:14px;position:relative;line-height:1.45}
.dead div::before{content:"\00d7";position:absolute;left:0;color:var(--blood);font-family:var(--mono)}
.dead b{color:var(--ink);font-weight:650}
.alarm{border:1px solid var(--blood);color:var(--blood);border-radius:3px;padding:9px 11px;font-size:13px}
.alarm.rented{border-color:var(--rent);color:var(--rent)}
.quiet{color:var(--faint);font-size:12.5px;font-style:italic}
.quiet::before{content:none!important}
.dials{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.dials label{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.dials output{font-family:var(--mono);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums}
.dials input[type=range]{width:100%;accent-color:var(--gold)}

/* the one bit of pure game furniture: an item tooltip */
.item[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:8px;right:8px;top:calc(100% - 4px);z-index:9;
  background:var(--stone-2);border:1px solid var(--gold-deep);border-radius:3px;padding:8px 10px;
  font-size:12px;color:var(--dim);line-height:1.45;white-space:pre-wrap;box-shadow:0 6px 20px rgba(0,0,0,.45);
}
.pmembers{display:grid;gap:6px}
.pm{display:flex;align-items:baseline;gap:8px;border:1px solid var(--edge-soft);border-radius:3px;
  padding:6px 9px;background:var(--stone-2);font-size:12.5px}
.pm .w{font-weight:650}
.pm .r{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.pm.host .r{color:var(--mine)}
#joinform{display:flex;gap:6px}
#joincode{flex:1 1 auto;min-width:0;background:var(--stone-2);border:1px solid var(--edge);border-radius:3px;
  padding:7px 9px;font-family:var(--mono);font-size:11px}
#joinform button{background:none;border:1px solid var(--gold-deep);color:var(--gold);border-radius:3px;
  padding:0 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.prow{display:flex;gap:6px}
.prow button{flex:1 1 0;background:none;border:1px solid var(--edge);color:var(--dim);border-radius:3px;
  padding:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.prow button:hover{border-color:var(--gold);color:var(--gold)}
.hosted::before{color:var(--mine)!important}
footer{padding:8px 16px;border-top:1px solid var(--edge);background:var(--stone);flex:0 0 auto;
  font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.05em;display:flex;gap:14px;flex-wrap:wrap}
footer a{color:var(--dim)}

/* Below 1080 the shadow drops under the pair; below 760 nothing shares a screen height and the page
   simply scrolls. Squeezing three panes into one phone screen left the log a few pixels tall. */
@media (max-width:1080px){
  main{grid-template-columns:minmax(0,270px) minmax(0,1fr)}
  #shadow{grid-column:1 / -1}
}
@media (max-width:760px){
  body{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  #you{grid-template-columns:1fr;gap:7px}
  .tools{justify-content:flex-start}
  .pane{overflow:visible}
  .pane>.hd{position:static}
  #shadow{grid-column:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="you">
  <div class="crest">
    <span class="nm">the<b>&middot;</b>armoury</span>
    <span class="rank" id="rank">rig 0 &middot; Renting</span>
  </div>
  <div class="xp">
    <div class="lab"><span>your own electric</span><span id="split">no kit yet</span></div>
    <div class="track" id="track"><i style="width:0"></i><u style="width:0"></u></div>
  </div>
  <div class="tools">
    <button type="button" id="theme">theme</button>
    <button type="button" id="reset">reset character</button>
  </div>
</div>

<main>
  <section class="pane" id="rigpane">
    <div class="hd"><h2>your rig</h2><em id="rigNote"></em></div>
    <div class="pad">
      <div class="slots" id="rungs"></div>
      <button type="button" id="train">train the next model</button>
      <div class="gain" id="gain"></div>

      <h2>party</h2>
      <div class="gain" id="partyNote"></div>
      <div class="pmembers" id="pmembers"></div>
      <form id="joinform">
        <input id="joincode" placeholder="paste an ally's code" aria-label="Paste an ally's code" autocomplete="off">
        <button type="submit">join</button>
      </form>
      <div class="prow">
        <button type="button" id="copycode">copy my code</button>
        <button type="button" id="disband">disband</button>
      </div>
      <div class="dead" id="psheet"></div>
    </div>
  </section>

  <section class="pane" id="mid">
    <div class="hd"><h2>where are you going</h2><em id="burn"></em></div>
    <div class="pad">
      <form id="zoneform">
        <textarea id="zone" rows="1" placeholder="say what the job is - audit the estate and gate every build" aria-label="Say what the job is"></textarea>
        <button id="go" type="submit">kit up</button>
      </form>
      <div class="quests" id="quests"></div>
      <div class="reads" id="reads"></div>
      <h2>your kit</h2>
      <div class="slots" id="kit"></div>
      <div id="vials"></div>
      <h2>log</h2>
      <div id="log"></div>
    </div>
  </section>

  <section class="pane" id="shadow">
    <div class="hd"><h2>what you cannot do</h2><em id="cannotN"></em></div>
    <div class="pad">
      <div id="alarms"></div>
      <div class="dead" id="dead"></div>
      <h2>scarcity</h2>
      <div class="dials" id="dials"></div>
    </div>
  </section>
</main>

<footer>
  <span id="proof">kernel: raid.mjs</span>
  <span>witness: mutation 1.00 &middot; 0 survivors</span>
  <a href="https://sjgant80-hub.github.io/fallworld/">&larr; fallworld</a>
  <a href="https://github.com/sjgant80-hub/didy-raid">source</a>
</footer>

<script type="module">
// ════════════════════════════════════════════════════════════════
// raid.mjs · the didy specs ITSELF for the job.
//
// You do not pick the kit. You say what the raid is, and the didy reads the whole estate, works out
// what the job actually needs, and equips for it — gear into slots, gems into sockets, potions if
// the run can afford them. Then it shows you the spec, and the other half: what this build CANNOT
// do, which is the part a character sheet never tells you.
//
// The three gaming words map onto real things, and the mapping is the design:
//
//   GEAR    an organ of the estate — witness, fall-remember, offramp. Slots are scarce, so equipping
//           one is a decision that costs something rather than a checkbox nobody reads.
//   GEM     a modifier socketed INTO a piece of gear. It changes how that tool behaves — deeper,
//           stricter, local-only — and it costs socket space the gear does not have much of.
//   POTION  a consumable spent for one run: a bigger budget, one escalation to a frontier model.
//           Consumed means gone, which is what makes a budget a budget.
//
// ⚑ EVERY EQUIPPED THING CARRIES WHY IT IS EQUIPPED. A loadout nobody can interrogate is a loadout
// nobody can correct — and an auto-specced one that cannot say why it chose is worse than a manual
// one, because you cannot even blame yourself. The `why` is not decoration; it is the whole reason
// this is trustworthy enough to let an agent do.
//
// Pure and total: no I/O, no clock, no randomness. The same task against the same catalogue always
// specs the same build, so a spec can be diffed, replayed, and argued with.
// ════════════════════════════════════════════════════════════════

const KAPPA = (Math.sqrt(5) - 1) / 2;      // the burn line: spend past it and the run is hot

// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE ONE THAT ACTUALLY LEVELS UP.
//
// Everybody starts renting. Day one every piece of thinking goes out to somebody else's frontier
// model on somebody else's electric, and the bill is the bill. What a player builds over months is
// not a bigger loadout — it is a RIG: their own models, on their own machine, good enough to take
// work back off the rented one. So the number that moves is the share of this raid that runs on
// your own electric, and it moves because you built something, not because you paid.
//
// MIND is what a tool takes to run. RIG is the biggest mind you own. Anything above your rig gets
// rented, and the sheet says exactly which pieces and exactly what fraction — a claim you can check
// against your own bill, which is the only reason to trust it.
const MIND = Object.freeze([0, 1, 2]);
const MIND_NAME = Object.freeze({
  0: 'no model — plain deterministic code, always yours',
  1: 'a small model — the kind that runs on a laptop',
  2: 'a large model — the reasoning a small one genuinely cannot do',
});
const RIG = Object.freeze([
  { level: 0, name: 'Renting',   holds: 0, blurb: 'no model of your own yet — every piece of thinking is rented' },
  { level: 1, name: 'Own Forge', holds: 1, blurb: 'a small model running locally: the grunt work comes home' },
  { level: 2, name: 'Sovereign', holds: 2, blurb: 'a large model of your own: nothing has to leave unless you send it' },
]);
const rigAt = (level) => RIG[Math.max(0, Math.min(RIG.length - 1, Number.isInteger(level) ? level : 0))];      // the burn line: spend past it and the run is hot

// What a piece of gear is FOR. A task names intents; gear declares them; the match is the spec.
const INTENT = Object.freeze({
  find: 'find', prove: 'prove', remember: 'remember', build: 'build',
  watch: 'watch', judge: 'judge', move: 'move', explain: 'explain',
});
const INTENTS = new Set(Object.values(INTENT));

// The words that actually appear when somebody describes a job, mapped to what the job NEEDS.
// Deliberately small and readable: a matcher nobody can read is a matcher nobody can correct.
const CUES = Object.freeze({
  [INTENT.find]:     ['find', 'search', 'sweep', 'audit', 'scan', 'where', 'which', 'locate', 'survey'],
  [INTENT.prove]:    ['prove', 'gate', 'test', 'verify', 'check', 'clean', 'mutation', 'evidence'],
  [INTENT.remember]: ['remember', 'memory', 'recall', 'history', 'past', 'session', 'log', 'note'],
  [INTENT.build]:    ['build', 'make', 'write', 'ship', 'create', 'add', 'implement', 'fix'],
  [INTENT.watch]:    ['watch', 'monitor', 'live', 'browse', 'page', 'site', 'observe', 'screenshot'],
  [INTENT.judge]:    ['judge', 'review', 'grade', 'score', 'rank', 'assess', 'compare', 'critique'],
  [INTENT.move]:     ['push', 'publish', 'deploy', 'commit', 'release', 'send', 'move'],
  [INTENT.explain]:  ['explain', 'why', 'report', 'summarise', 'summarize', 'tell', 'describe'],
});

// A value can refuse to become a string: an object whose toString throws takes the whole reader
// down with it. Reading a job is the first thing that happens, so it has to survive anything.
const text = (v) => { try { return String(v ?? ''); } catch { return ''; } };
const words = (s) => text(s).toLowerCase().match(/[a-z0-9:+-]+/g) || [];

/**
 * What does this job need? Returns each intent with the cues that fired, so the didy can say WHY it
 * read the task that way — and so you can see immediately when it read it wrong.
 */
function readTask(task) {
  const w = new Set(words(task));
  const wanted = [];
  for (const [intent, cues] of Object.entries(CUES)) {
    const hit = cues.filter(c => w.has(c));
    if (hit.length) wanted.push({ intent, hit, weight: hit.length });
  }
  wanted.sort((a, b) => b.weight - a.weight || a.intent.localeCompare(b.intent));
  return wanted;
}

/** Declare a piece of gear. `intents` is what it is for; `cost` is what a slot of it burns. */
function gear({ id, name, intents = [], cost = 1, sockets = 0, does = '', needs = [], keys = [], mind = 0 } = {}) {
  if (typeof id !== 'string' || !id) throw new Error('gear needs an id');
  for (const i of intents) if (!INTENTS.has(i)) throw new Error(`${id}: ${JSON.stringify(i)} is not an intent`);
  if (!Number.isFinite(cost) || cost < 0) throw new Error(`${id}: cost must be a non-negative number`);
  if (!Number.isInteger(sockets) || sockets < 0) throw new Error(`${id}: sockets must be a whole number`);
  if (!MIND.includes(mind)) throw new Error(`${id}: mind must be one of ${MIND.join(', ')} — how much model it takes to run`);
  return Object.freeze({
    id, name: name || id, intents: Object.freeze([...intents]), cost, sockets,
    does: String(does || ''), needs: Object.freeze([...needs]),
    keys: Object.freeze(keys.map(k => String(k).toLowerCase())), mind,
  });
}

/** A gem modifies one piece of gear. `fits` limits which gear it can go into. */
function gem({ id, name, fits = [], cost = 0, does = '' } = {}) {
  if (typeof id !== 'string' || !id) throw new Error('a gem needs an id');
  if (!Number.isFinite(cost) || cost < 0) throw new Error(`${id}: cost must be a non-negative number`);
  return Object.freeze({ id, name: name || id, fits: Object.freeze([...fits]), cost, does: String(does || '') });
}

/** A potion is spent for one run and then gone. That is what makes a budget mean anything. */
function potion({ id, name, cost = 1, does = '', grants = [] } = {}) {
  if (typeof id !== 'string' || !id) throw new Error('a potion needs an id');
  if (!Number.isFinite(cost) || cost < 0) throw new Error(`${id}: cost must be a non-negative number`);
  return Object.freeze({ id, name: name || id, cost, does: String(does || ''), grants: Object.freeze([...grants]) });
}

/** How well this gear serves the job, and the reason — never a bare number. */
const NAMED = 2;      // what a direct hit on the gear's own vocabulary is worth

/**
 * ⚑ A JOB THAT NAMES A TOOL OUTRANKS A JOB THAT MERELY IMPLIES ONE. Scoring on intent alone made
 * "which builds have no gate" equip the badge-stamper over the gate itself: both serve `prove`, and
 * the stamper was a slot cheaper. When the task uses a tool's own word, that is the strongest signal
 * in the sentence and it has to beat a tie-break on price.
 */
function scoreGear(g, wanted, said) {
  if (!g || typeof g !== 'object') return { score: 0, why: '', matched: [], named: [] };
  const w = Array.isArray(wanted) ? wanted.filter(x => x && typeof x === 'object') : [];
  const heard = said instanceof Set ? said : new Set();
  const intents = Array.isArray(g.intents) ? g.intents : [];
  const keys = Array.isArray(g.keys) ? g.keys : [];
  const matched = w.filter(x => intents.includes(x.intent));
  const named = keys.filter(k => heard.has(k));
  if (!matched.length && !named.length) return { score: 0, why: '', matched: [], named: [] };
  const score = matched.reduce((s, m) => s + (Number.isFinite(m.weight) ? m.weight : 0), 0) + named.length * NAMED;
  const parts = [];
  if (matched.length) {
    parts.push(`the job asks to ${matched.map(m => m.intent).join(' and ')} `
      + `(${matched.flatMap(m => m.hit).join(', ')})`);
  }
  if (named.length) parts.push(`the job names it directly (${named.join(', ')})`);
  const why = `${parts.join(', and ')}, and this ${g.does || 'serves that'}`;
  return { score, why, matched: matched.map(m => m.intent), named };
}

/**
 * SPEC THE BUILD. The didy reads the task, scores every piece of gear against it, and fills the
 * slots it can afford — best first, and never past the budget.
 *
 * ⚑ GEAR WHOSE PREREQUISITE IS NOT EQUIPPED IS REFUSED, not quietly equipped. A tool that needs
 * another tool and does not get it is worse than absent: it looks equipped and does nothing, which
 * is the dead-control failure this estate keeps finding on its own pages.
 *
 * ⚑ AND THE BUDGET IS A HARD CEILING, not a suggestion. An auto-specced build that can talk itself
 * over budget is an agent choosing its own resource limit, which is not a limit.
 */
function spec(task, catalogue, limits) {
  // Total on any input. A kernel that throws on a malformed catalogue turns a bad config into a
  // blank screen, and the didy that was supposed to explain itself explains nothing.
  const list = (v) => (Array.isArray(v) ? v.filter(x => x && typeof x === 'object' && typeof x.id === 'string') : []);
  const num = (v, dflt) => (Number.isFinite(v) && v >= 0 ? v : dflt);
  const cat = (catalogue && typeof catalogue === 'object') ? catalogue : {};
  const l = (limits && typeof limits === 'object') ? limits : {};
  const slots = Number.isInteger(l.slots) ? num(l.slots, 4) : 4;
  const rig = rigAt(l.rig);
  const budget = num(l.budget, 6);
  const potionBudget = num(l.potionBudget, 2);

  const wanted = readTask(task);
  const said = new Set(words(task));
  const allGear = list(cat.gear).map(g => ({ ...g, intents: Array.isArray(g.intents) ? g.intents : [],
    needs: Array.isArray(g.needs) ? g.needs : [], keys: Array.isArray(g.keys) ? g.keys : [],
    cost: num(g.cost, 0), sockets: Number.isInteger(g.sockets) ? num(g.sockets, 0) : 0,
    mind: MIND.includes(g.mind) ? g.mind : 0 }));
  const allGems = list(cat.gems).map(j => ({ ...j, fits: Array.isArray(j.fits) ? j.fits : [], cost: num(j.cost, 0) }));
  const allPotions = list(cat.potions).map(p => ({ ...p, grants: Array.isArray(p.grants) ? p.grants : [], cost: num(p.cost, 0) }));

  const ranked = allGear
    .map(g => ({ g, ...scoreGear(g, wanted, said) }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score || a.g.cost - b.g.cost || a.g.id.localeCompare(b.g.id));

  const equipped = [];
  const passed = [];
  let spent = 0;

  const byId = new Map(allGear.map(g => [g.id, g]));

  /**
   * Everything that must go in for this one piece of gear to actually work: itself, plus any
   * prerequisite not already equipped, plus THEIR prerequisites. Returns null if the chain reaches
   * something the catalogue does not contain, or loops back on itself.
   */
  const closure = (g, seen = new Set()) => {
    if (seen.has(g.id)) return null;                       // a needs-cycle is a broken catalogue
    seen.add(g.id);
    const out = [];
    for (const n of g.needs) {
      if (equipped.some(e => e.id === n)) continue;
      const dep = byId.get(n);
      if (!dep) return null;                               // needs a tool nobody has
      const sub = closure(dep, seen);
      if (!sub) return null;
      out.push(...sub);
    }
    out.push(g);
    return out;
  };

  /**
   * ⚑ ALL-OR-NOTHING, AND COUNTED AFTER THE CHAIN IS KNOWN. The first version checked the slot and
   * budget ceilings against the one piece of gear asked for, and only then went looking for its
   * prerequisites — so a tool plus the tool it needs went two into one slot and the ceiling that
   * was supposed to be hard silently was not. A limit checked before you know the full cost is not
   * a limit. Nothing is committed until the whole chain is known to fit.
   */
  // One tool, one reason. The coverage pass and the fill pass both consider the same catalogue, so
  // without this a piece of gear appears twice in the shadow — the same refusal read as two.
  const refuse = (id, why, score) => { if (!passed.some(p => p.id === id)) passed.push({ id, why, score }); return false; };

  const take = (entry) => {
    const { g, score, why, matched } = entry;
    if (equipped.some(e => e.id === g.id)) return true;   // already in, and that is a covered role
    const chain = closure(g);
    if (!chain) return refuse(g.id, `needs ${g.needs.join(', ')}, which nothing here can supply`, score);
    if (equipped.length + chain.length > slots) {
      return refuse(g.id, chain.length > 1
        ? `it and the ${chain.length - 1} tool(s) it needs will not fit the slots left`
        : 'no slot left', score);
    }
    const price = chain.reduce((a, c) => a + c.cost, 0);
    if (spent + price > budget) {
      return refuse(g.id, chain.length > 1
        ? `it and what it needs would cost ${price}, and only ${budget - spent} is left`
        : `would cost ${g.cost}, and only ${budget - spent} is left`, score);
    }
    for (const c of chain) {
      const own = c.id === g.id;
      equipped.push({
        id: c.id, name: c.name, cost: c.cost, sockets: c.sockets,
        score: own ? score : 0,
        why: own ? why : `carried because ${g.name} needs it, and ${c.does || 'it is required'}`,
        serves: own ? matched : [], gems: [], mind: c.mind,
        // Rented means this piece needs more model than the rig owns, so it goes out to somebody
        // else's machine and somebody else's bill. Stated per piece, because "40% rented" that you
        // cannot break down into which parts is a number nobody can act on.
        rented: c.mind > rig.holds,
      });
      spent += c.cost;
    }
    return true;
  };

  for (const w of wanted) {
    // FALL DOWN THE LIST, DO NOT GIVE UP ON THE ROLE. Taking only the single best candidate meant
    // that if the strongest tool for a role could not fit the slots or the purse, the role went
    // uncovered, while a cheaper tool that would have covered it sat right underneath in the
    // ranking. A party missing a healer because the best healer was expensive is a bad party.
    for (const r of ranked) {
      if (!r.matched.includes(w.intent)) continue;
      // take() answers "is this role now covered" — including when the tool was already equipped for
      // an earlier role, since one tool covering two roles is a covered role, not a free slot.
      if (take(r)) break;
    }
  }

  for (const entry of ranked) take(entry);

  // Gems go into the gear already equipped, best fit first, still inside the same budget.
  for (const j of allGems) {
    const host = equipped.find(e => (j.fits.length === 0 || j.fits.includes(e.id)) && e.gems.length < e.sockets);
    if (!host) continue;
    if (spent + j.cost > budget) continue;
    host.gems.push({ id: j.id, name: j.name, does: j.does, cost: j.cost });
    spent += j.cost;
  }

  // Potions last, out of their own purse: a consumable must never eat the gear budget.
  const drunk = [];
  let potionSpent = 0;
  for (const p of allPotions) {
    const relevant = p.grants.some(gr => wanted.some(w => w.intent === gr));
    if (!relevant) continue;
    if (potionSpent + p.cost > potionBudget) continue;
    drunk.push({ id: p.id, name: p.name, does: p.does, cost: p.cost });
    potionSpent += p.cost;
  }

  const heat = budget > 0 ? spent / budget : 0;
  // ⚑ A SPEC THAT READ NOTHING MUST NOT REPORT 'COOL'. An empty loadout burns no budget, so a
  // spend-based reading calls it healthy — the didy walks in carrying nothing and the HUD shows
  // green. Not understanding the job and not needing much are opposite states and must never print
  // the same word.
  const understood = wanted.length > 0;
  // A role the job named that nothing in the loadout serves. Said plainly, because a build that
  // silently cannot do a third of the job is the failure this whole sheet exists to prevent.
  // ── the sovereignty read ──────────────────────────────────────────────────────────────────
  // Weighted by cost, not by count: one expensive rented organ is more of your bill than three
  // free local ones, and a headline that counts heads would say the opposite of the invoice.
  const rented = equipped.filter(e => e.rented);
  const weigh = (list) => list.reduce((a, e) => a + e.cost, 0);
  const totalWeight = weigh(equipped);
  const rentedWeight = weigh(rented);
  // Nothing equipped is not 100% sovereign — it is nothing, and saying "100%" there would be the
  // exact badge-that-cannot-fail this estate keeps finding. No loadout, no claim.
  const sovereignty = equipped.length === 0 ? null
    : totalWeight === 0 ? (rented.length ? 0 : 1)
    : 1 - rentedWeight / totalWeight;
  // No level comparison here on purpose: a piece is only "rented" when its mind is ABOVE what this
  // rig holds, so no rung at or below the current one can ever reclaim it. Testing for it as well
  // read like a safety check and was a condition that could never once decide anything.
  const nextRig = RIG.find(r => rented.some(e => e.mind <= r.holds)) || null;

  const served = new Set(equipped.flatMap(e => e.serves));
  const uncovered = wanted.map(w => w.intent).filter(i => !served.has(i));
  const status = !understood ? 'read nothing in the job'
    : !equipped.length ? 'nothing carried covers this job'
    : uncovered.length ? 'cannot ' + uncovered.join('/') + ' - nothing equipped serves it'
    : heat <= KAPPA ? 'cool' : heat < 1 ? 'hot' : 'at the ceiling';
  return {
    task: text(task),
    reads: wanted,
    equipped, gems: equipped.flatMap(e => e.gems.map(g => ({ ...g, in: e.id }))),
    potions: drunk,
    passed,
    spent, budget, potionSpent, potionBudget,
    slotsUsed: equipped.length, slots,
    heat, understood, uncovered,
    rig, sovereignty, rented: rented.map(e => ({ id: e.id, name: e.name, mind: e.mind, cost: e.cost })),
    // What building the next rig would actually buy you, in the only currency that matters here:
    // the pieces that would stop being rented. Null when nothing you own would change.
    nextRig: nextRig && { ...nextRig, wouldReclaim: rented.filter(e => e.mind <= nextRig.holds).map(e => e.name) },
    // Past κ the run is burning hot: it will finish, but there is no room left for a surprise.
    status,
  };
}

/**
 * THE OTHER HALF. Everything in the catalogue this build did NOT take, and why — the shadow of the
 * spec. A character sheet shows what you can do; this shows what this particular build cannot, which
 * is the thing you actually need before you walk into the raid.
 */
function cannot(specced, catalogue) {
  const s = (specced && typeof specced === 'object') ? specced : {};
  const cat = (catalogue && typeof catalogue === 'object') ? catalogue : {};
  const on = new Set((Array.isArray(s.equipped) ? s.equipped : []).map(e => e && e.id));
  const reason = new Map((Array.isArray(s.passed) ? s.passed : []).map(p => [p && p.id, p && p.why]));
  return (Array.isArray(cat.gear) ? cat.gear : []).filter(g => g && typeof g.id === 'string')
    .filter(g => !on.has(g.id))
    .map(g => ({
      id: g.id, name: g.name, does: g.does,
      why: reason.get(g.id) || 'nothing in the job asked for it',
      kind: reason.has(g.id) ? 'left behind' : 'not needed',
    }));
}

/** One line a person can read, for the top of the HUD. */
function readout(specced) {
  const s = (specced && typeof specced === 'object') ? specced : {};
  const on = (Array.isArray(s.equipped) ? s.equipped : []).filter(e => e && typeof e === 'object');
  if (!on.length) {
    return s.understood
      ? `nothing equipped — the job reads as ${(s.reads || []).map(r => r.intent).join('/')}, and nothing carried serves that`
      : `nothing equipped — nothing in the job read as a job this didy knows how to do`;
  }
  return `${on.map(e => text(e.name) + ((e.gems || []).length ? ` (${e.gems.filter(Boolean).map(g => text(g.name)).join(', ')})` : '')).join(' · ')}`
    + `  —  ${s.spent}/${s.budget} spent, ${s.slotsUsed}/${s.slots} slots, ${s.status}`;
}


// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE PARTY. Two didys hooking up for the same job.
//
// ⚑ WHAT POOLS IS THE RIG, NOT THE SLOTS. It would be easy — and wrong — to make a party simply add
// its members' slots and budgets together, because then partying up is just a bigger single player
// and nobody has a reason to bring anybody specific. What actually pools is whose machine the work
// runs on: if one member owns a large local model, the party can host the heavy thinking on THEIR
// electric instead of renting it, and everybody's rented share falls. That is a real reason to find
// somebody who built something you did not.
//
// ⚑ AND THE PARTY'S SHADOW IS COMPUTED, NEVER ASSUMED. A group that believes it is covered because
// somebody surely brought the gate is more dangerous than one person who knows they did not. So the
// roles the job named and nobody covered are named, out loud, before the party goes anywhere.

/** Who in the party can host a piece of work of this mind, cheapest rig first. */
function hostFor(mind, members) {
  if (!MIND.includes(mind)) return null;
  const able = (Array.isArray(members) ? members : [])
    .filter(m => m && typeof m === 'object' && rigAt(m.rig && m.rig.level).holds >= mind);
  if (!able.length) return null;
  // The lightest rig that can carry it: a party should not put every job on its one big machine.
  return able.reduce((a, b) => (rigAt(a.rig && a.rig.level).holds <= rigAt(b.rig && b.rig.level).holds ? a : b));
}

/**
 * Form a party out of already-specced members. Each member is what spec() returned, plus a `who`.
 * Nothing here re-specs anybody: a party must not quietly change what somebody brought.
 */
function party(members, catalogue, task) {
  const list = (Array.isArray(members) ? members : [])
    .filter(m => m && typeof m === 'object' && Array.isArray(m.equipped))
    .map((m, i) => ({ ...m, who: typeof m.who === 'string' && m.who ? m.who : `didy ${i + 1}` }));
  const cat = (catalogue && typeof catalogue === 'object') ? catalogue : {};
  const wanted = readTask(task !== undefined ? task : (list[0] && list[0].task));

  // Every role the job named, and every member who actually brought something serving it.
  const roles = wanted.map(w => ({
    intent: w.intent,
    by: list.filter(m => m.equipped.some(e => (e.serves || []).includes(w.intent))).map(m => m.who),
  }));
  const uncovered = roles.filter(r => !r.by.length).map(r => r.intent);

  // Overlap is not teamwork. Two people bringing the same organ for the same role is a slot the
  // party paid for twice, and saying so is how a group learns to complement instead of duplicate.
  const seen = new Map();
  for (const m of list) for (const e of m.equipped) {
    if (!seen.has(e.id)) seen.set(e.id, { id: e.id, name: e.name, by: [] });
    seen.get(e.id).by.push(m.who);
  }
  const doubled = [...seen.values()].filter(x => x.by.length > 1);

  // Who hosts what. A piece rented by its owner is reclaimed the moment somebody in the party owns
  // a rig big enough to run it — that is the whole point of standing next to each other.
  const hosted = [];
  let ownWeight = 0, rentWeight = 0, ownCount = 0, rentCount = 0;
  for (const m of list) for (const e of m.equipped) {
    const h = hostFor(e.mind, list);
    const w = Number.isFinite(e.cost) ? e.cost : 0;
    if (h) { ownWeight += w; ownCount += 1; if (e.rented) hosted.push({ id: e.id, name: e.name, from: m.who, host: h.who }); }
    else { rentWeight += w; rentCount += 1; }
  }
  const total = ownWeight + rentWeight;
  // ⚑ WHEN EVERYTHING IS FREE, WEIGHT CANNOT TELL YOU ANYTHING. Falling back on the weight of what
  // is rented reads a kit of free-but-rented tools as perfectly sovereign — a score that cannot
  // fail, on the one number this whole room is about. With no prices to weigh, count heads instead.
  const sovereignty = !seen.size ? null
    : total === 0 ? (ownCount + rentCount === 0 ? null : ownCount / (ownCount + rentCount))
    : ownWeight / total;

  const covered = new Set(list.flatMap(m => m.equipped.flatMap(e => e.serves || [])));
  const gear = Array.isArray(cat.gear) ? cat.gear.filter(g => g && typeof g.id === 'string') : [];
  return {
    members: list.map(m => ({ who: m.who, rig: m.rig, brought: m.equipped.map(e => e.name), sovereignty: m.sovereignty })),
    roles, uncovered, doubled, hosted, sovereignty,
    // Between them, still nobody's: the party's own shadow, not any one member's.
    cannot: gear.filter(g => !seen.has(g.id)).map(g => ({ id: g.id, name: g.name, does: g.does })),
    covered: [...covered],
    task: text(task !== undefined ? task : (list[0] && list[0].task)),
  };
}

    does: 'a separate pass that tries to refute the first one instead of agreeing with it' }),
];

const CATALOGUE = { gear: GEAR, gems: GEMS, potions: POTIONS };


// ══════════════════════════════════════════════════════════════════════════════════════════════
// THE ROOM. Everything below only DRAWS what the kernel above decided, so what a player sees is
// what the gate proved. The one thing this file owns is the SAVE — because a character that
// forgets its rig every time you close the tab is not a character, it is a demo.
// ══════════════════════════════════════════════════════════════════════════════════════════════
const $ = (s) => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// The save is shared across fallworld on purpose: ONE character, every room. A room that keeps its
// own private copy is how a world ends up with three different versions of the same player.
const SAVE = 'fallworld.character.v1';
const load = () => {
  try {
    const c = JSON.parse(localStorage.getItem(SAVE) || '{}');
    return {
      rig: Number.isInteger(c.rig) ? Math.max(0, Math.min(RIG.length - 1, c.rig)) : 0,
      last: typeof c.last === 'string' ? c.last : '',
      name: typeof c.name === 'string' && c.name.trim() ? c.name.trim().slice(0, 24) : 'you',
      party: Array.isArray(c.party)
        ? c.party.filter(m => m && typeof m.who === 'string' && Number.isInteger(m.rig)).slice(0, 4) : [],
    };
  } catch { return { rig: 0, last: '', name: 'you', party: [] }; }
};
// Private browsing throws on write. Losing the save is a shame; losing the room is not acceptable.
const save = (c) => { try { localStorage.setItem(SAVE, JSON.stringify(c)); } catch { /* play on, just do not remember */ } };

let me = load();
let now = null;
const LIMITS = { slots: 4, budget: 6, potionBudget: 2 };

const QUESTS = [
  'audit the estate and gate every build',
  'prove this kernel is clean and judge the tests',
  'remember this session and recall it by meaning',
  'build and ship a page, then push it live',
  'watch the live page and check it renders',
  'explain where this agent is blind',
];

const tier = (e) => (e.rented ? 'rent' : e.mind === 0 ? 'mine' : 'small');

function tell(who, txt) {
  const l = el('div', 'line ' + who);
  l.append(el('div', 'who', who === 'you' ? 'you' : 'didy'));
  const t = el('div', 'txt'); t.innerHTML = txt; l.append(t);
  $('#log').append(l);
}

// ── the character bar ─────────────────────────────────────────────────────────────────────────
function drawYou(s) {
  const r = rigAt(me.rig);
  $('#rank').textContent = `rig ${r.level} · ${r.name}`;
  $('#rigNote').textContent = r.holds === 0 ? 'no model of your own' : `holds mind ${r.holds}`;

  const own = $('#track i'), rented = $('#track u');
  if (!s || s.sovereignty === null) {
    own.style.width = '0'; rented.style.width = '0';
    $('#split').textContent = 'no kit yet';
  } else {
    const pct = Math.round(s.sovereignty * 100);
    own.style.width = pct + '%'; rented.style.width = (100 - pct) + '%';
    $('#split').innerHTML = pct === 100 ? `<b>${pct}% yours</b>`
      : `<b>${pct}% yours</b> &middot; <b class="part">${100 - pct}% rented</b>`;
  }

  const rungs = $('#rungs'); rungs.replaceChildren();
  for (const rung of RIG) {
    const d = el('div', 'rung' + (rung.level === r.level ? ' now' : ''));
    d.append(el('span', 'pip'));
    const b = el('div');
    b.append(el('div', 't', `${rung.level} · ${rung.name}`));
    b.append(el('div', 's', rung.blurb));
    d.append(b); rungs.append(d);
  }

  const train = $('#train'), gain = $('#gain');
  const next = s && s.nextRig;
  if (me.rig >= RIG.length - 1) {
    train.disabled = true; train.textContent = 'nothing left to rent';
    gain.textContent = 'You own every size of model this ladder knows about. Nothing in a kit has to leave your machine.';
  } else if (next) {
    train.disabled = false; train.textContent = `train up to ${next.name}`;
    gain.innerHTML = `Building this takes <b>${next.wouldReclaim.map(esc).join('</b>, <b>')}</b> off rented compute and onto your own.`;
  } else {
    train.disabled = false; train.textContent = `train up to ${rigAt(me.rig + 1).name}`;
    gain.innerHTML = (s && s.equipped.length)
      ? 'Nothing in this kit is rented, so the next model buys you nothing <em>here</em>. It will on a harder job.'
      : 'Name a job and this says exactly what the next model would take back off rented compute.';
  }
}

// ── the kit ───────────────────────────────────────────────────────────────────────────────────
function drawKit(s) {
  const kit = $('#kit'); kit.replaceChildren();
  for (const e of s.equipped) {
    const d = el('div', 'item ' + tier(e));
    d.dataset.tip = `${e.name}\n${MIND_NAME[e.mind]}\ncosts ${e.cost} of your ${s.budget}\n\n${e.why}`;
    const r1 = el('div', 'r1');
    r1.append(el('span', 'nm', e.name));
    const tags = el('span', 'tagline');
    if (e.serves.length) tags.append(el('span', 'pill', e.serves.join(' · ')));
    tags.append(el('span', 'pill ' + (e.rented ? 'rent' : 'mine'), e.rented ? 'rented' : 'yours'));
    r1.append(tags); d.append(r1);
    d.append(el('div', 'why', e.why));
    if (e.sockets) {
      const sock = el('div', 'sockets');
      for (const g of e.gems) {
        const rn = el('span', 'rune'); rn.append(el('i'));
        rn.append(document.createTextNode(g.name)); rn.title = g.does; sock.append(rn);
      }
      for (let i = e.gems.length; i < e.sockets; i++) { const h = el('span', 'hole'); h.title = 'empty socket'; sock.append(h); }
      d.append(sock);
    }
    kit.append(d);
  }
  for (let i = s.equipped.length; i < s.slots; i++) kit.append(el('div', 'item void', 'empty slot'));

  const v = $('#vials'); v.replaceChildren();
  if (s.potions.length) {
    const row = el('div', 'sockets');
    for (const p of s.potions) {
      const x = el('span', 'vial'); x.append(el('b', null, p.name));
      x.append(document.createTextNode(p.does)); row.append(x);
    }
    v.append(row);
  }

  const reads = $('#reads'); reads.replaceChildren();
  for (const r of s.reads) { const c = el('span', 'read'); c.innerHTML = `${esc(r.intent)} <span>${esc(r.hit.join(' '))}</span>`; reads.append(c); }

  $('#burn').textContent = `${s.slotsUsed}/${s.slots} slots · ${s.spent}/${s.budget} · ${s.status}`;
}

// ── the shadow ────────────────────────────────────────────────────────────────────────────────
function drawShadow(s) {
  const al = $('#alarms'); al.replaceChildren();
  if (s.uncovered.length) {
    al.append(el('div', 'alarm', `You cannot ${s.uncovered.join(' or ')} on this kit. The job asked for it and nothing you carry serves it.`));
  }
  if (s.rented.length) {
    al.append(el('div', 'alarm rented',
      `${s.rented.map(r => r.name).join(', ')} ${s.rented.length === 1 ? 'runs' : 'run'} on rented compute — more model than your rig holds.`));
  }
  const no = cannot(s, CATALOGUE);
  const left = no.filter(c => c.kind === 'left behind');
  const dead = $('#dead'); dead.replaceChildren();
  for (const c of left) { const d = el('div'); d.innerHTML = `<b>${esc(c.name)}</b> — ${esc(c.why)}`; dead.append(d); }
  if (!left.length) dead.append(el('div', 'quiet', 'Nothing was refused for room or price.'));
  const rest = no.length - left.length;
  if (rest) dead.append(el('div', 'quiet', `${rest} more in the estate that this job never called for.`));
  $('#cannotN').textContent = `${no.length} of ${CATALOGUE.gear.length}`;
}

function speak(s) {
  if (!s.understood) {
    return tell('didy', 'I could not find a job in that. I listen for what a job <b>needs</b> — to find, prove, remember, build, watch, judge, move or explain. Name the verb and I will kit for it.');
  }
  const bits = [`Read as <b>${s.reads.map(r => esc(r.intent)).join('</b>, <b>')}</b>. Kitted ${s.equipped.length} of ${s.slots} for ${s.spent} of ${s.budget}.`];
  if (s.sovereignty !== null) {
    const pct = Math.round(s.sovereignty * 100);
    bits.push(pct === 100 ? 'All of it runs on your own electric.'
      : `<b>${pct}%</b> runs on your electric; ${s.rented.map(r => `<b>${esc(r.name)}</b>`).join(', ')} ${s.rented.length === 1 ? 'is' : 'are'} rented.`);
  }
  if (s.uncovered.length) bits.push(`<em>I cannot ${esc(s.uncovered.join(' or '))} with this.</em>`);
  tell('didy', bits.join(' '));
}

// ── one path in ───────────────────────────────────────────────────────────────────────────────
function kitUp(job, announce) {
  now = spec(job, CATALOGUE, { slots: LIMITS.slots, budget: LIMITS.budget, potionBudget: LIMITS.potionBudget, rig: me.rig });
  drawYou(now); drawKit(now); drawShadow(now); drawParty(job);
  if (announce) speak(now);
  return now;
}

$('#zoneform').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const job = $('#zone').value.trim();
  if (!job) return;
  tell('you', esc(job));
  me.last = job; save(me);
  kitUp(job, true);
  $('#log').lastElementChild.scrollIntoView({ block: 'nearest' });
});
$('#zone').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); $('#zoneform').requestSubmit(); }
});

for (const q of QUESTS) {
  const b = el('button', 'quest', q); b.type = 'button';
  b.addEventListener('click', () => { $('#zone').value = q; $('#zoneform').requestSubmit(); });
  $('#quests').append(b);
}

$('#train').addEventListener('click', () => {
  if (me.rig >= RIG.length - 1) return;
  me.rig += 1; save(me);
  const r = rigAt(me.rig);
  tell('didy', `You built <b>${esc(r.name)}</b> — ${esc(r.blurb)}.`);
  kitUp(me.last, true);
});

$('#reset').addEventListener('click', () => {
  me = { rig: 0, last: me.last, name: me.name, party: [] }; save(me);
  tell('didy', 'Character reset. Back to renting every piece of thinking.');
  kitUp(me.last, false);
});

$('#theme').addEventListener('click', () => {
  const set = document.documentElement.getAttribute('data-theme');
  const dark = set ? set === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
});

const dials = $('#dials');
for (const [key, label, min, max] of [['slots', 'slots', 0, 8], ['budget', 'budget', 0, 12], ['potionBudget', 'vials', 0, 4]]) {
  const l = el('label', null, label); l.htmlFor = 'd-' + key;
  const i = el('input'); i.type = 'range'; i.id = 'd-' + key; i.min = min; i.max = max; i.value = LIMITS[key];
  const o = el('output', null, String(LIMITS[key]));
  i.addEventListener('input', () => { LIMITS[key] = Number(i.value); o.textContent = i.value; kitUp(me.last, false); });
  dials.append(l, i, o);
}

// ── the party ─────────────────────────────────────────────────────────────────────────────────
// No server and no signalling: an ally is a short code you paste. The estate's mesh is the richer
// transport, but a code that works offline, on a phone, with no account, is the one people actually
// use — and it is honest about being a snapshot of what somebody built, not a live link to them.
const code = (c) => btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/=+$/, '');
const uncode = (t) => {
  try {
    const c = JSON.parse(decodeURIComponent(escape(atob(String(t).trim()))));
    if (!c || typeof c !== 'object') return null;
    const rig = Number.isInteger(c.r) ? Math.max(0, Math.min(RIG.length - 1, c.r)) : 0;
    const who = typeof c.w === 'string' && c.w.trim() ? c.w.trim().slice(0, 24) : 'an ally';
    return { who, rig };
  } catch { return null; }
};
const myCode = () => code({ w: me.name, r: me.rig });

function drawParty(job) {
  const note = $('#partyNote'), sheet = $('#psheet'), list = $('#pmembers');
  list.replaceChildren(); sheet.replaceChildren();

  if (!me.party.length) {
    note.innerHTML = 'Alone. Paste an ally code and what they built comes with them — if they own a '
      + 'bigger model, the party runs your rented work on <b>their</b> electric instead of renting it.';
    return;
  }

  const all = [{ who: me.name, rig: me.rig }, ...me.party];
  const kits = all.map(m => ({
    ...spec(job, CATALOGUE, { slots: LIMITS.slots, budget: LIMITS.budget, potionBudget: LIMITS.potionBudget, rig: m.rig }),
    who: m.who,
  }));
  const p = party(kits, CATALOGUE, job);

  for (const m of p.members) {
    const d = el('div', 'pm' + (p.hosted.some(h => h.host === m.who) ? ' host' : ''));
    d.append(el('span', 'w', m.who));
    d.append(el('span', 'r', 'rig ' + m.rig.level + ' · ' + m.rig.name));
    list.append(d);
  }

  const solo = now ? now.sovereignty : null;
  if (p.sovereignty === null) {
    note.textContent = 'Nobody has kitted for anything yet.';
  } else {
    const up = (solo !== null && p.sovereignty > solo) ? ' — up from ' + Math.round(solo * 100) + '% alone.' : '.';
    note.innerHTML = 'The party runs <b>' + Math.round(p.sovereignty * 100) + '%</b> on its own machines' + up;
  }

  for (const h of p.hosted) {
    const d = el('div', 'hosted');
    d.innerHTML = '<b>' + esc(h.name) + '</b> — ' + esc(h.from) + ' would rent it; ' + esc(h.host) + ' hosts it';
    sheet.append(d);
  }
  if (p.uncovered.length) {
    const d = el('div');
    d.innerHTML = '<b>Nobody covers ' + esc(p.uncovered.join(' or ')) + '</b> — the job asked and no member brought it';
    sheet.append(d);
  }
  for (const dd of p.doubled) {
    const d = el('div');
    d.innerHTML = '<b>' + esc(dd.name) + '</b> — brought twice (' + dd.by.map(esc).join(', ') + '); one of those slots is free';
    sheet.append(d);
  }
  if (!sheet.childElementCount) sheet.append(el('div', 'quiet', 'No overlap, no gaps, nothing to reclaim.'));
}

$('#joinform').addEventListener('submit', (ev) => {
  ev.preventDefault();
  const ally = uncode($('#joincode').value);
  if (!ally) {
    tell('didy', 'That code did not read as anybody. Ask them to press <b>copy my code</b> and send the whole thing.');
    return;
  }
  if (ally.who === me.name || me.party.some(m => m.who === ally.who)) {
    tell('didy', '<b>' + esc(ally.who) + '</b> is already in the party.');
    return;
  }
  me.party.push(ally); save(me);
  $('#joincode').value = '';
  tell('didy', '<b>' + esc(ally.who) + '</b> joined — ' + esc(rigAt(ally.rig).name) + '.');
  kitUp(me.last, false);
});

$('#copycode').addEventListener('click', async () => {
  const c = myCode();
  try {
    await navigator.clipboard.writeText(c);
    tell('didy', 'Your code is copied. Send it to whoever you are raiding with.');
  } catch {
    // Clipboard is blocked on plain http and in some browsers. Showing the code beats a dead button.
    tell('didy', 'Copy is blocked here, so here it is to select by hand:\n<b>' + esc(c) + '</b>');
  }
});

$('#disband').addEventListener('click', () => {
  if (!me.party.length) { tell('didy', 'You are already alone.'); return; }
  me.party = []; save(me);
  tell('didy', 'Party disbanded.');
  kitUp(me.last, false);
});

$('#proof').textContent = `kernel: raid.mjs · ${CATALOGUE.gear.length} organs · ${CATALOGUE.gems.length} runes · ${CATALOGUE.potions.length} vials`;

tell('didy', `I am your didy. Say where you are going and I kit myself from the estate — <b>organs</b> into slots, <b>runes</b> into their sockets, a <b>vial</b> only if it earns its place. Everything I equip tells you why, and I always show you what this kit <b>cannot</b> do.\n\nThe bar at the top is the only thing that really levels up: how much of the job runs on <b>your own electric</b> instead of rented. It rises when you build a model, never when you spend.`);

if (me.last) { $('#zone').value = me.last; kitUp(me.last, false); } else { kitUp('', false); }
</script>
</body>
</html>
